<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Elemento</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Red+Hat+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/css/themes.css">
    
    <!-- Forms CSS -->
    <link rel="stylesheet" href="/css/forms.css">
</head>
<body>
    <div class="form-container form-container--checkout">
        <div class="form-header">
            <h1 class="form-title">Create your account</h1>
            <p class="form-subtitle">Includes a personal organisation and a 14-day Electros trial. Then download Electros and sign in.</p>
        </div>

        <form id="signupForm" autocomplete="on" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First name *</label>
                    <input type="text" id="firstName" name="given-name" autocomplete="given-name" autocapitalize="words" required placeholder="Ada">
                </div>
                <div class="form-group">
                    <label for="lastName">Last name *</label>
                    <input type="text" id="lastName" name="family-name" autocomplete="family-name" autocapitalize="words" required placeholder="Lovelace">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="username" autocomplete="username" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" required placeholder="you@company.com">
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input
                    type="password"
                    id="password"
                    name="new-password"
                    autocomplete="new-password"
                    passwordrules="minlength: 12; required: lower; required: upper; required: digit; required: special;"
                    minlength="12"
                    maxlength="128"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    required
                    aria-describedby="passwordHint"
                    placeholder="At least 12 characters">
                <p class="form-field-hint" id="passwordHint">At least 12 characters, with upper and lower case, a number, and a symbol.</p>
            </div>

            <div class="form-group">
                <label for="passwordConfirm">Confirm password *</label>
                <input
                    type="password"
                    id="passwordConfirm"
                    name="new-password-confirm"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="128"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    required
                    placeholder="Repeat password">
            </div>

            <div class="checkbox-label">
                <input type="checkbox" id="newsletter" name="newsletter" value="true">
                <label for="newsletter">Subscribe to our newsletter for updates and insights</label>
            </div>

            <div class="checkbox-label">
                <input type="checkbox" id="terms" name="terms" value="true" required>
                <label for="terms">I agree to the <a href="/terms.html" target="_blank" rel="noopener noreferrer">Terms and Conditions</a>, <a href="/privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>, and <a href="/cookie.html" target="_blank" rel="noopener noreferrer">Cookie Policy</a> *</label>
            </div>

            <button type="submit" class="btn btn-primary form-submit" id="submitBtn">
                Create account
            </button>
        </form>

        <p class="form-foot">
            <a href="/buy-seat.html" id="buySeatLink" target="_top">Already have an account? Sign in &amp; buy a seat</a>
        </p>

        <div class="form-error-message" id="errorMessage">
            <p>Please complete all required fields.</p>
        </div>
    </div>

    <script>
        // Same-origin proxy → https://portal.elemento.cloud (see astro.config.mjs + public/_redirects)
        const PORTAL_REGISTER_URL = '/api/portal/v2/account/register/login';
        // Matches Electros access-client bootstrap when no session token exists yet
        const PORTAL_BOOTSTRAP_AUTH = 'Bearer null';

        const UI = {
            en: {
                pwdMin: 'Password must be at least 12 characters.',
                pwdMax: 'Password must be at most 128 characters.',
                pwdLower: 'Password must include a lowercase letter.',
                pwdUpper: 'Password must include an uppercase letter.',
                pwdNumber: 'Password must include a number.',
                pwdSymbol: 'Password must include a symbol (e.g. !@#$%).',
                pwdMatch: 'Passwords do not match.',
                waitSubmit: 'Please wait before submitting again.',
                tooMany: 'Too many submission attempts. Please try again later.',
                completeCarefully: 'Please complete the form carefully, then try again.',
                requiredFields: 'Please complete all required fields correctly.',
                creating: 'Creating account…',
                createAccount: 'Create account',
                emailExists: 'An account with that email already exists. Sign in with Electros or use a different email.',
                tryAgain: 'Please try again.',
                regFailedPrefix: 'Registration failed.',
                regFailedNetwork: 'Registration failed. Could not reach the Elemento portal. Please try again.',
            },
            it: {
                pwdMin: 'La password deve avere almeno 12 caratteri.',
                pwdMax: 'La password può avere al massimo 128 caratteri.',
                pwdLower: 'La password deve includere una lettera minuscola.',
                pwdUpper: 'La password deve includere una lettera maiuscola.',
                pwdNumber: 'La password deve includere un numero.',
                pwdSymbol: 'La password deve includere un simbolo (es. !@#$%).',
                pwdMatch: 'Le password non coincidono.',
                waitSubmit: 'Attendi prima di inviare di nuovo.',
                tooMany: 'Troppi tentativi di invio. Riprova più tardi.',
                completeCarefully: 'Compila il modulo con attenzione, poi riprova.',
                requiredFields: 'Compila correttamente tutti i campi obbligatori.',
                creating: 'Creazione account…',
                createAccount: 'Crea account',
                emailExists: 'Esiste già un account con questa email. Accedi con Electros o usa un’altra email.',
                tryAgain: 'Riprova.',
                regFailedPrefix: 'Registrazione non riuscita.',
                regFailedNetwork: 'Registrazione non riuscita. Impossibile raggiungere il portale Elemento. Riprova.',
            },
            fr: {
                pwdMin: 'Le mot de passe doit contenir au moins 12 caractères.',
                pwdMax: 'Le mot de passe peut contenir au maximum 128 caractères.',
                pwdLower: 'Le mot de passe doit inclure une lettre minuscule.',
                pwdUpper: 'Le mot de passe doit inclure une lettre majuscule.',
                pwdNumber: 'Le mot de passe doit inclure un chiffre.',
                pwdSymbol: 'Le mot de passe doit inclure un symbole (p. ex. !@#$%).',
                pwdMatch: 'Les mots de passe ne correspondent pas.',
                waitSubmit: 'Veuillez patienter avant de renvoyer le formulaire.',
                tooMany: 'Trop de tentatives. Réessayez plus tard.',
                completeCarefully: 'Veuillez remplir le formulaire attentivement, puis réessayez.',
                requiredFields: 'Veuillez remplir correctement tous les champs obligatoires.',
                creating: 'Création du compte…',
                createAccount: 'Créer un compte',
                emailExists: 'Un compte existe déjà avec cet e-mail. Connectez-vous avec Electros ou utilisez un autre e-mail.',
                tryAgain: 'Veuillez réessayer.',
                regFailedPrefix: 'Échec de l’inscription.',
                regFailedNetwork: 'Échec de l’inscription. Impossible de joindre le portail Elemento. Réessayez.',
            },
        };

        function pageLocale() {
            if (window.ElementoI18n?.getPageLocale) return window.ElementoI18n.getPageLocale();
            const lang = document.documentElement.lang;
            if (lang === 'it' || lang === 'fr') return lang;
            const path = window.location.pathname;
            if (path.startsWith('/it/') || path === '/it') return 'it';
            if (path.startsWith('/fr/') || path === '/fr') return 'fr';
            return 'en';
        }

        function t(key) {
            const loc = pageLocale();
            return (UI[loc] && UI[loc][key]) || UI.en[key] || key;
        }

        function localeHref(stem) {
            const loc = pageLocale();
            if (window.ElementoI18n?.localeStemHref) {
                return window.ElementoI18n.localeStemHref(stem, loc);
            }
            return loc === 'en' ? `/${stem}.html` : `/${loc}/${stem}.html`;
        }

        const buySeatLink = document.getElementById('buySeatLink');
        if (buySeatLink) {
            buySeatLink.href = localeHref('buy-seat');
            buySeatLink.setAttribute('target', '_top');
        }

        let formSubmissionAttempts = 0;
        let lastSubmissionTime = 0;
        const MAX_ATTEMPTS = 5;
        let userInteractions = 0;
        const formLoadTime = Date.now();

        document.addEventListener('mousemove', () => { userInteractions++; });
        document.addEventListener('keypress', () => { userInteractions++; });
        document.addEventListener('click', () => { userInteractions++; });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = `<p>${message}</p>`;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 8000);
        }

        function passwordStrengthError(value) {
            if (!value || value.length < 12) {
                return t('pwdMin');
            }
            if (value.length > 128) {
                return t('pwdMax');
            }
            if (!/[a-z]/.test(value)) {
                return t('pwdLower');
            }
            if (!/[A-Z]/.test(value)) {
                return t('pwdUpper');
            }
            if (!/[0-9]/.test(value)) {
                return t('pwdNumber');
            }
            if (!/[^A-Za-z0-9]/.test(value)) {
                return t('pwdSymbol');
            }
            return '';
        }

        function validateForm() {
            const form = document.getElementById('signupForm');
            const requiredFields = form.querySelectorAll('[required]');
            let isValid = true;
            let passwordMessage = '';

            requiredFields.forEach((field) => {
                const empty = field.type === 'checkbox' ? !field.checked : !String(field.value || '').trim();
                if (empty) {
                    isValid = false;
                    if (field.type !== 'checkbox') {
                        field.style.borderColor = '#DC3545';
                    }
                } else if (field.type !== 'checkbox') {
                    field.style.borderColor = '';
                }
            });

            const email = document.getElementById('email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.value)) {
                isValid = false;
                email.style.borderColor = '#DC3545';
            }

            const password = document.getElementById('password');
            const passwordConfirm = document.getElementById('passwordConfirm');
            passwordMessage = passwordStrengthError(password.value);
            if (passwordMessage) {
                isValid = false;
                password.style.borderColor = '#DC3545';
            }
            if (password.value !== passwordConfirm.value) {
                isValid = false;
                passwordConfirm.style.borderColor = '#DC3545';
                if (!passwordMessage) {
                    passwordMessage = t('pwdMatch');
                }
            }

            const terms = document.getElementById('terms');
            if (!terms.checked) {
                isValid = false;
            }

            validateForm.lastPasswordMessage = passwordMessage;
            return isValid;
        }

        document.getElementById('signupForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const now = Date.now();
            if (now - lastSubmissionTime < 3000) {
                showError(t('waitSubmit'));
                return;
            }
            if (formSubmissionAttempts >= MAX_ATTEMPTS) {
                showError(t('tooMany'));
                return;
            }
            if (now - formLoadTime < 2000 || userInteractions < 2) {
                showError(t('completeCarefully'));
                return;
            }
            if (!validateForm()) {
                showError(validateForm.lastPasswordMessage || t('requiredFields'));
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = t('creating');
            formSubmissionAttempts++;
            lastSubmissionTime = now;

            const payload = {
                user_name: document.getElementById('firstName').value.trim(),
                user_surname: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                preferences: {
                    marketing_emails: document.getElementById('newsletter').checked
                }
            };

            try {
                const response = await fetch(PORTAL_REGISTER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': PORTAL_BOOTSTRAP_AUTH
                    },
                    body: JSON.stringify(payload)
                });

                let data = null;
                const text = await response.text();
                try {
                    data = text ? JSON.parse(text) : null;
                } catch (_) {
                    data = null;
                }

                if (response.ok && data) {
                    try {
                        if (data.access_token) {
                            sessionStorage.setItem('elemento_access_token', data.access_token);
                        }
                        if (data.username) {
                            sessionStorage.setItem('elemento_username', data.username);
                        }
                        sessionStorage.setItem('elemento_registration', JSON.stringify({
                            at: Date.now(),
                            email: payload.email
                        }));
                    } catch (_) { /* ignore storage failures */ }

                    const successHref = localeHref('signup-success');

                    if (window.parent !== window) {
                        window.parent.postMessage({
                            type: 'form-submitted',
                            formType: 'signup',
                            data: { success: true, email: payload.email },
                            timestamp: now
                        }, '*');
                        // Parent (e.g. electros.cloud) owns the redirect when embedded
                        return;
                    }

                    window.location.href = successHref;
                    return;
                }

                if (response.status === 409) {
                    showError(t('emailExists'));
                } else {
                    const detail = (data && (data.detail || data.message)) || text || t('tryAgain');
                    const detailText = typeof detail === 'string' ? detail : JSON.stringify(detail);
                    showError(`${t('regFailedPrefix')} ${detailText}`);
                }
            } catch (error) {
                console.error('Portal registration error:', error);
                showError(t('regFailedNetwork'));
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = t('createAccount');
            }
        });

        // Theme sync with parent page when embedded
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'theme-change') {
                document.body.className = event.data.theme;
            }
        });

        function applyThemeFromStorage() {
            try {
                let savedTheme = localStorage.getItem('elemento-theme');
                if (!savedTheme && window.parent !== window) {
                    try {
                        savedTheme = window.parent.localStorage.getItem('elemento-theme');
                    } catch (_) { /* ignore */ }
                }
                if (savedTheme) {
                    document.body.className = savedTheme;
                }
            } catch (_) { /* ignore */ }
        }

        applyThemeFromStorage();

        if (window.parent !== window) {
            window.parent.postMessage({ type: 'request-theme' }, '*');
        }

        function notifyParentResize() {
            if (window.parent === window) return;
            const height = Math.max(
                document.body.scrollHeight,
                document.documentElement.scrollHeight
            );
            window.parent.postMessage({ type: 'iframe-resize', height }, '*');
        }

        if (window.self !== window.top) {
            document.documentElement.classList.add('is-embedded');
        }

        window.addEventListener('load', notifyParentResize);
        window.addEventListener('resize', notifyParentResize);
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(notifyParentResize).observe(document.body);
        }
    </script>
</body>
</html>
